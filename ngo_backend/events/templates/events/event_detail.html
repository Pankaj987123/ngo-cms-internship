{% extends 'base.html' %}

{% block content %}

<div class="container">

   <div class="card">
       <img src="{{ event.image.url }}">
       <h2>{{ event.title }}</h2>
       <p>{{ event.description }}</p>
       <p>{{ event.date }} | {{ event.location }}</p>
        
       <div class="mt-3 d-grid gap-2">
            <a href="/event/{{ event.id }}/" class="btn blue">View</a>
            <a href="/donate/" class="btn btn-success">Donate</a>
            <a href="/events/" class="btn btn-secondary">Back</a>
        </div>

    </div>

</div>

{% endblock %}
