{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>SevaConnect</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar">
    <div class="logo">SevaConnect</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/events/">Events</a>
        <a href="/donate/">Donate</a>

        {% if user.is_authenticated %}
            <a href="/accounts/logout/">Logout</a>
        {% else %}
            <a href="/accounts/">Login</a>
            <a href="/accounts/register/">Register</a>
        {% endif %}
    </div>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
